# FNO Surrogate Configuration for SPE10 2D
model:
  fourier_modes: 16
  num_fourier_layers: 4
  lifting_channels: 64
  hidden_channels: 64
  unet_stages: 2
  activation: gelu
  
training:
  learning_rate: 5.0e-4
  batch_size: 16
  epochs: 100
  physics_penalty_weight: 0.1
  
data:
  train_samples: 4000
  val_samples: 1000
  observation_timesteps: 19
  num_wells: 5
